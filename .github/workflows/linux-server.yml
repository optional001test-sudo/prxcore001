echo "║   🎉 ULTRA LOW-LATENCY WORKSTATION & BROWSER ACTIVE!     ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║                                                          ║"
          printf "║  🚀 Remote Desktop / Chrome: https://%s\n" "$PRX_DOMAIN"
          printf "║  💻 Web Terminal:            https://%s/terminal/\n" "$PRX_DOMAIN"
          echo "║  🔐 Login Username:          prxcore                     ║"
          echo "║  🔐 Password:                [Defined in PRX_USER_PASS]  ║"
          echo "║                                                          ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  ⚡ Ultra Optimizations Applied:                        ║"
          echo "║    ✅ Full XFCE Desktop + Native X11 Key Mapping        ║"
          echo "║    ✅ Dual Language Keyboard (English + Persian)         ║"
          echo "║    ✅ Toggle Shortcut: Alt + Shift                       ║"
          echo "║    ✅ Google Chrome Official Stable Engine Installed     ║"
          echo "║    ✅ Persian Standard Fonts (Vazirmatn / FarsiWeb)     ║"
          echo "║    ✅ 8GB Shared RAM (shm) + Host IPC Mode              ║"
          echo "║    ✅ BBR Congestion Control + 64MB Massive Buffers     ║"
          echo "║    ✅ Cloud Session Persistence (Auto Cookies/Logins)   ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🚀 VLESS Connection Link:                              ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "$VLESS_LINK"
          echo ""
          echo "⏱️ سرور تا ۶ ساعت فعال می‌ماند..."
          echo "=================================================="

          for i in $(seq 1 360); do
            sleep 60
            if [ $((i % 10)) -eq 0 ]; then
              CF_UP=$(pgrep -c -f "cloudflared" 2>/dev/null || echo "0")
              XRAY_UP=$(pgrep -c -f "xray" 2>/dev/null || echo "0")
              KASM_UP=$(sudo docker inspect -f '{{.State.Running}}' kasm-chrome 2>/dev/null || echo "false")
              echo "[$i/360] 📊 Status: Proto=HTTP/2 | CF=$CF_UP | Xray=$XRAY_UP | Kasm=$Kasm_UP"
            else
              echo "[$i/360] 🟢 Running on $PRX_DOMAIN (HTTP/2 Stable)"
            fi
          done
          echo "⏰ ۶ ساعت تمام شد. سرور خاموش می‌شود."

      # === ۷. متوقف کردن ایمن کانتینر برای ذخیره نهایی کوکی‌ها و پاکسازی موقت‌ها ===
      - name: 7. Gracefully Stop Browser & Clean Sockets
        if: always()
        run: |
          echo "⏹️ متوقف کردن ایمن کانتینر برای ثبت نهایی کوکی‌ها..."
          sudo docker stop kasm-chrome -t 10 2>/dev/null || true
          
          # حذف فایل‌های موقت، قفل‌ها و سوکت‌های لینوکسی که مانع کش شدن می‌شوند
          sudo rm -rf /home/runner/kasm_data/.cache \
                      /home/runner/kasm_data/Singleton* \
                      /home/runner/kasm_data/.config/google-chrome/Singleton* \
                      /home/runner/kasm_data/.X11-unix \
                      /home/runner/kasm_data/tmp 2>/dev/null || true
          
          # آزادسازی دسترسی کامل جهت ساخت آرشیو کش
          sudo chown -R runner:docker /home/runner/kasm_data
          sudo chmod -R 777 /home/runner/kasm_data
          echo "✅ داده‌های پروفایل با موفقیت آماده ذخیره‌سازی شدند."

      # === ۸. ذخیره‌سازی آرشیو سشن‌ها و کوکی‌ها در گیت‌هاب ===
      - name: 8. Save Persistent Browser Profile & Cookies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/kasm_data
          key: kasm-profile-${{ github.run_id }}
