name: prxcore Beast Workstation & Ultra Low-Latency Remote Browser (Webtop XFCE + Xray XHTTP)

on:
  workflow_dispatch:
    inputs:
      enable_desktop:
        description: 'فعال‌سازی ریموت دسکتاپ XFCE و مرورگر Chrome (در حالت خاموش فقط پروکسی XHTTP و وب‌ترمینال با حداکثر سرعت اجرا می‌شوند)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prxcore-workstation-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TERM: xterm-256color
      ENABLE_DESKTOP: ${{ inputs.enable_desktop }}
      CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      PRX_DOMAIN: ${{ secrets.PRX_DOMAIN }}
      PRX_UUID: ${{ secrets.PRX_UUID }}
      PRX_USER_PASS: ${{ secrets.PRX_USER_PASS }}

    steps:
      # === ۰. بازیابی سشن‌ها، کوکی‌ها و افزونه‌های ذخیره‌شده (فقط در حالت دسکتاپ) ===
      - name: 0. Restore Persistent Browser Profile & Cookies
        if: ${{ inputs.enable_desktop }}
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/kasm_data
          key: kasm-profile-${{ github.run_id }}
          restore-keys: |
            kasm-profile-

      # === ۱. اعتبارسنجی سکرت‌ها و بهینه‌سازی کرنل برای کمترین پینگ و بیشترین سرعت ===
      - name: 1. Validate Secrets & Deep Kernel Network Tuning (BBR + Low-Jitter DNS + MSS Clamping)
        run: |
          # --- اعتبارسنجی و پاکسازی سکرت‌ها ---
          if [ -z "$CF_TOKEN" ] || [ -z "$PRX_DOMAIN" ] || [ -z "$PRX_UUID" ] || [ -z "$PRX_USER_PASS" ]; then
            echo "❌ خطا: لطفاً مطمئن شوید تمام سکرت‌ها (CF_TUNNEL_TOKEN, PRX_DOMAIN, PRX_UUID, PRX_USER_PASS) در تنظیمات گیت‌هاب تعریف شده‌اند."
            exit 1
          fi

          CLEAN_DOMAIN=$(printf '%s' "$PRX_DOMAIN" | tr -d '\r\n ' | sed -E 's|^https?://||; s|/.*$||')
          CLEAN_UUID=$(printf '%s' "$PRX_UUID" | tr -d '\r\n ')
          echo "PRX_DOMAIN=$CLEAN_DOMAIN" >> "$GITHUB_ENV"
          echo "PRX_UUID=$CLEAN_UUID" >> "$GITHUB_ENV"
          echo "✅ تمام سکرت‌ها تأیید شدند (دامنه: $CLEAN_DOMAIN)."

          # --- تثبیت DNS بدون چرخش (حذف rotate و 9.9.9.9 برای حذف نوسان پینگ DNS) ---
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\noptions edns0 timeout:2 attempts:3\n" | sudo tee /etc/resolv.conf > /dev/null

          # --- فعال‌سازی ماژول BBR در هسته لینوکس ---
          sudo modprobe tcp_bbr 2>/dev/null || true
          echo "tcp_bbr" | sudo tee -a /etc/modules-load.d/bbr.conf > /dev/null

          # --- بهینه‌سازی کرنل برای کاهش لیتنسی، بافربلوت و پشتیبانی کامل بافر QUIC ---
          sudo tee /etc/sysctl.d/99-prxcore-optimize.conf > /dev/null <<'SYSCTL'
          # === BBR Congestion Control ===
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr

          # === غیرفعال‌سازی TCP Fast Open برای جلوگیری از دراپ پکت‌های TLS در NAT آژور/گیت‌هاب ===
          net.ipv4.tcp_fastopen = 0

          # === حذف وقفه Slow Start پس از بی‌کاری سوکت ===
          net.ipv4.tcp_slow_start_after_idle = 0

          # === کاهش فوق‌العاده Bufferbloat و لیتنسی ===
          net.ipv4.tcp_notsent_lowat = 16384

          # === بافرهای متعادل شبکه (پیش‌فرض 256KB برای ضد بافربلوت و سقف 16MB برای QUIC و سرعت بالا) ===
          net.core.rmem_default = 262144
          net.core.rmem_max = 16777216
          net.core.wmem_default = 262144
          net.core.wmem_max = 16777216
          net.ipv4.tcp_rmem = 4096 262144 16777216
          net.ipv4.tcp_wmem = 4096 262144 16777216
          net.core.somaxconn = 65535
          net.core.netdev_max_backlog = 250000
          net.core.optmem_max = 65536

          # === تنظیمات Window Scaling و ریکاوری بلادرنگ پکت‌ها ===
          net.ipv4.tcp_window_scaling = 1
          net.ipv4.tcp_adv_win_scale = 1
          net.ipv4.tcp_sack = 1
          net.ipv4.tcp_dsack = 1
          net.ipv4.tcp_timestamps = 1
          net.ipv4.tcp_no_metrics_save = 1
          net.ipv4.tcp_frto = 2
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_max_tw_buckets = 2000000

          # === Keepalive بهینه ===
          net.ipv4.tcp_keepalive_time = 20
          net.ipv4.tcp_keepalive_intvl = 5
          net.ipv4.tcp_keepalive_probes = 9

          # === امنیت و فعال‌سازی MTU Probing ===
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_syn_backlog = 65535
          net.ipv4.tcp_mtu_probing = 1
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.tcp_ecn = 0

          # === ARP و غیرفعال‌سازی IPv6 برای مسیردهی مستقیم IPv4 ===
          net.ipv4.neigh.default.gc_thresh1 = 1024
          net.ipv4.neigh.default.gc_thresh2 = 4096
          net.ipv4.neigh.default.gc_thresh3 = 8192
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          SYSCTL

          sudo sysctl -p /etc/sysctl.d/99-prxcore-optimize.conf > /dev/null 2>&1 || sudo sysctl --system > /dev/null 2>&1

          # --- تنظیم خودکار سایز پکت‌ها (TCP MSS Clamping) ---
          sudo iptables -t mangle -A POSTROUTING ! -o lo -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true

          echo "✅ تنظیمات کرنل، DNS کم‌جیتر، BBR، بافر QUIC، MTU Probing و TCP MSS Clamping اعمال شدند."

      # === ۲الف. ایجاد کاربر امن، تشخیص لوکیشن رانر و نصب پیش‌نیازهای هسته ===
      - name: 2a. Setup Secure User & Core Dependencies
        run: |
          id -u prxcore &>/dev/null || sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:$PRX_USER_PASS" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore > /dev/null
          sudo chmod 440 /etc/sudoers.d/prxcore
          sudo mkdir -p /home/prxcore/.config/tmux
          sudo chown -R prxcore:prxcore /home/prxcore

          # --- حذف میرور ناپایدار آژور و جایگزینی با مخازن اصلی اوبونتو ---
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null <<'MIRRORS'
          http://archive.ubuntu.com/ubuntu/
          http://us.archive.ubuntu.com/ubuntu/
          http://mirrors.edge.kernel.org/ubuntu/
          MIRRORS
          fi
          sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors\.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true

          # --- نصب پکیج‌ها با اجبار به IPv4 و تلاش مجدد خودکار ---
          sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout="15" update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y \
            htop tmux curl wget unzip nginx jq -qq

          # نمایش و ذخیره لوکیشن جغرافیایی رانر (برای اطلاع سریع از شرق یا غرب آمریکا)
          RUNNER_INFO=$(curl -4 -s --max-time 5 https://ipinfo.io/json || echo '{}')
          RUNNER_LOC=$(echo "$RUNNER_INFO" | jq -r '"\(.city // "Unknown"), \(.region // "Unknown") (\(.org // "Unknown"))"')
          echo "RUNNER_LOC=$RUNNER_LOC" >> "$GITHUB_ENV"
          echo "🌍 Runner Location: $RUNNER_LOC"

          # نصب fastfetch (از مخزن یا نسخه رسمی گیت‌هاب)
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y fastfetch -qq 2>/dev/null; then
            curl -fsSL --retry 3 https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb -o /tmp/fastfetch.deb 2>/dev/null && \
              sudo dpkg -i /tmp/fastfetch.deb >/dev/null 2>&1 || true
            rm -f /tmp/fastfetch.deb
          fi

          # دانلود پایدار ttyd و cloudflared
          sudo curl -fsSL --retry 5 --retry-delay 2 https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          sudo curl -fsSL --retry 5 --retry-delay 2 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          echo "✅ کاربر امن و پیش‌نیازهای اصلی نصب شدند."

      # === ۲ب. راه‌اندازی میزکار Webtop XFCE و مرورگر Chrome (فقط در صورت فعال بودن enable_desktop) ===
      - name: 2b. Deploy Extreme Webtop XFCE Desktop & Chrome
        id: setup_desktop
        if: ${{ inputs.enable_desktop }}
        run: |
          mkdir -p /home/runner/kasm_data/.config/autostart
          mkdir -p /home/runner/kasm_data/Desktop

          # حذف فایل‌های قفل موقت پیشین
          sudo rm -f /home/runner/kasm_data/Singleton* \
                      /home/runner/kasm_data/.config/google-chrome/Singleton* 2>/dev/null || true

          # تنظیم سوییچ دائمی کیبورد فارسی و انگلیسی با Alt+Shift در استارتاپ میزکار
          cat <<'DESKTOP' > /home/runner/kasm_data/.config/autostart/keyboard.desktop
          [Desktop Entry]
          Type=Application
          Exec=setxkbmap -layout "us,ir" -option "grp:alt_shift_toggle"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=Persian Keyboard Layout
          DESKTOP

          # فلگ‌های بهینه کروم (بهره‌گیری واقعی از 4GB /dev/shm + دو ترد رستر برای روان ماندن Selkies)
          CHROME_FLAGS="--no-sandbox --password-store=basic --disable-quic --num-raster-threads=2 --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader --no-first-run --no-default-browser-check"

          # شورت‌کات اجرای مرورگر کروم روی دسکتاپ
          cat <<DESKTOP > /home/runner/kasm_data/Desktop/google-chrome.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome
          Comment=Access the Internet
          Exec=/usr/bin/google-chrome-stable $CHROME_FLAGS %U
          Icon=google-chrome
          Path=/config
          Terminal=false
          StartupNotify=true
          DESKTOP
          chmod +x /home/runner/kasm_data/Desktop/google-chrome.desktop

          # اجرای خودکار مرورگر کروم هنگام بالا آمدن دسکتاپ
          cat <<DESKTOP > /home/runner/kasm_data/.config/autostart/chrome.desktop
          [Desktop Entry]
          Type=Application
          Exec=/usr/bin/google-chrome-stable $CHROME_FLAGS
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=Google Chrome Autostart
          DESKTOP

          sudo chown -R 1000:1000 /home/runner/kasm_data

          # اجرای کانتینر میزکار کامل لینوکس (حذف --ipc=host برای فعال‌سازی واقعی --shm-size=4g)
          sudo docker run -d \
            --name=kasm-chrome \
            --hostname=prxcore-desktop \
            -p 127.0.0.1:3000:3000 \
            --shm-size=4g \
            --dns=1.1.1.1 \
            --dns=8.8.8.8 \
            -v /home/runner/kasm_data:/config \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e LC_ALL=en_US.UTF-8 \
            -e CUSTOM_USER=prxcore \
            -e PASSWORD="$PRX_USER_PASS" \
            -e KEYBOARD="us,ir" \
            --restart unless-stopped \
            lscr.io/linuxserver/webtop:ubuntu-xfce

          # انتظار هوشمند تا بالا آمدن کامل سرور گرافیکی Xorg/Selkies در کانتینر
          echo "⏳ انتظار برای بالا آمدن کامل X Server در کانتینر..."
          for i in {1..30}; do
            if sudo docker exec kasm-chrome pgrep -f "Xorg|Xvfb|selkies" >/dev/null 2>&1; then
              echo "✅ سرور گرافیکی آماده است."
              break
            fi
            sleep 1
          done

          # نصب مستقل فونت‌های فارسی، ابزار کیبورد و مرورگر Google Chrome
          echo "⏳ در حال نصب فونت‌های فارسی و Google Chrome روی میزکار..."
          sudo docker exec -u 0 kasm-chrome bash -c '
            set -e
            apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true update -qq
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y -qq x11-xkb-utils wget ca-certificates
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y -qq fonts-vazirmatn 2>/dev/null || true
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y -qq fonts-farsiweb 2>/dev/null || true
            wget -q --tries=5 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y -qq /tmp/chrome.deb || \
              DEBIAN_FRONTEND=noninteractive apt-get -f install -y -qq
            rm -f /tmp/chrome.deb
            apt-get clean
            rm -rf /var/lib/apt/lists/*
          '

          # اعمال نقشه کیبورد و اجرای قطعی کروم (بدون باگ خودتطبیقی pgrep)
          sudo docker exec -u 1000 -e HOME=/config -e CHROME_FLAGS="$CHROME_FLAGS" kasm-chrome bash -c '
            DISP=$(ls /tmp/.X11-unix 2>/dev/null | sed "s/^X/:/" | head -n 1)
            export DISPLAY="${DISP:-:1}"
            setxkbmap -layout "us,ir" -option "grp:alt_shift_toggle" 2>/dev/null || true
            if ! pgrep -f "/opt/google/chrome/chrome" >/dev/null 2>&1; then
              nohup /usr/bin/google-chrome-stable $CHROME_FLAGS </dev/null >/dev/null 2>&1 &
            fi
          ' 2>/dev/null || true

          echo "✅ میزکار XFCE همراه با Google Chrome و کیبورد فارسی مستقر شدند."

      # === ۳. نصب و پیکربندی Xray-Core با پروتکل XHTTP (SplitHTTP) روی Unix Domain Socket ===
      - name: 3. Install & Configure Xray-Core (UDS + VLESS XHTTP / SplitHTTP + 512KB Buffer)
        run: |
          export TERM=xterm-256color
          curl -fsSL --retry 5 https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o /tmp/install-xray.sh
          sed -i 's/tput setaf [0-9]/true/g; s/tput sgr0/true/g' /tmp/install-xray.sh

          if ! sudo env TERM=xterm-256color bash /tmp/install-xray.sh install; then
            echo "⚠️ اسکریپت نصب با محدودیت مواجه شد؛ در حال نصب تمیز مستقیم هسته Xray..."
            sudo mkdir -p /usr/local/bin /usr/local/share/xray /usr/local/etc/xray
            rm -rf /tmp/xray_extract && mkdir -p /tmp/xray_extract
            curl -fsSL --retry 5 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
            unzip -qo /tmp/xray.zip -d /tmp/xray_extract
            sudo install -m 755 /tmp/xray_extract/xray /usr/local/bin/xray
            sudo mv -f /tmp/xray_extract/*.dat /usr/local/share/xray/ 2>/dev/null || true
            rm -rf /tmp/xray.zip /tmp/xray_extract

            cat <<'SERVICE' | sudo tee /etc/systemd/system/xray.service > /dev/null
          [Unit]
          Description=Xray Service
          Documentation=https://github.com/xtls
          After=network.target nss-lookup.target

          [Service]
          User=nobody
          CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          ExecStart=/usr/local/bin/xray run -config /usr/local/etc/xray/config.json
          Restart=always
          RestartSec=2
          LimitNPROC=10000
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          SERVICE
          fi
          rm -f /tmp/install-xray.sh

          # اعمال Override روی سرویس Xray (اولویت بالای CPU، پاکسازی سوکت پیش از استارت و بازیابی خودکار)
          sudo mkdir -p /etc/systemd/system/xray.service.d
          cat <<'OVERRIDE' | sudo tee /etc/systemd/system/xray.service.d/override.conf > /dev/null
          [Service]
          Nice=-10
          LimitNOFILE=1048576
          Restart=always
          RestartSec=2
          ExecStartPre=+-/bin/rm -f /dev/shm/xray.sock
          OVERRIDE

          sudo mkdir -p /usr/local/etc/xray
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json > /dev/null
          {
            "log": {
              "loglevel": "warning",
              "access": "none"
            },
            "dns": {
              "servers": [
                "1.1.1.1",
                "8.8.8.8"
              ],
              "queryStrategy": "UseIPv4",
              "disableCache": false
            },
            "inbounds": [
              {
                "listen": "/dev/shm/xray.sock,0666",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$PRX_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "xhttp",
                  "xhttpSettings": {
                    "path": "/prx-xhttp",
                    "mode": "auto"
                  }
                },
                "sniffing": {
                  "enabled": true,
                  "destOverride": ["http", "tls", "quic"],
                  "routeOnly": false
                }
              }
            ],
            "outbounds": [
              {
                "tag": "direct",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIPv4"
                },
                "streamSettings": {
                  "sockopt": {
                    "tcpNoDelay": true,
                    "tcpCongestion": "bbr",
                    "tcpKeepAliveInterval": 15,
                    "tcpKeepAliveIdle": 30
                  }
                }
              },
              {
                "tag": "block",
                "protocol": "blackhole",
                "settings": {
                  "response": {
                    "type": "none"
                  }
                }
              }
            ],
            "routing": {
              "domainStrategy": "AsIs",
              "rules": [
                {
                  "type": "field",
                  "outboundTag": "block",
                  "protocol": ["bittorrent", "quic"]
                },
                {
                  "type": "field",
                  "outboundTag": "block",
                  "network": "udp",
                  "port": "443"
                },
                {
                  "type": "field",
                  "outboundTag": "direct",
                  "network": "tcp,udp"
                }
              ]
            },
            "policy": {
              "levels": {
                "0": {
                  "handshake": 10,
                  "connIdle": 300,
                  "uplinkOnly": 5,
                  "downlinkOnly": 10,
                  "bufferSize": 512
                }
              },
              "system": {
                "statsOutboundUplink": false,
                "statsOutboundDownlink": false
              }
            }
          }
          EOF

          # تست اعتبارسنجی کانفیگ Xray پیش از اجرا
          sudo /usr/local/bin/xray run -test -config /usr/local/etc/xray/config.json

          sudo systemctl daemon-reload
          sudo systemctl enable xray
          sudo systemctl restart xray
          sleep 2

          XRAY_VER=$(/usr/local/bin/xray version | head -n 1 || echo "unknown")
          if sudo systemctl is-active --quiet xray && [ -S /dev/shm/xray.sock ]; then
            echo "✅ $XRAY_VER با XHTTP روی Unix Domain Socket (/dev/shm/xray.sock) و بافر 512KB اجرا شد."
          else
            echo "❌ خطا در اجرای Xray یا ایجاد سوکت یونیکس:"
            sudo journalctl -u xray --no-pager -n 25
            exit 1
          fi

      # === ۴. پیکربندی Nginx مالتی‌پلکسر (بهینه‌شده برای XHTTP روی سوکت یونیکس + Keepalive واقعی) ===
      - name: 4. Configure Nginx Ultra Multiplexer (Unix Socket + XHTTP Streaming)
        run: |
          cat <<'MAIN' | sudo tee /etc/nginx/nginx.conf > /dev/null
          user www-data;
          worker_processes auto;
          worker_rlimit_nofile 131072;
          pid /run/nginx.pid;

          events {
              worker_connections 16384;
              multi_accept on;
              use epoll;
          }

          http {
              map $http_upgrade $connection_upgrade {
                  default upgrade;
                  '' "";
              }

              map $http_x_forwarded_proto $forwarded_proto {
                  default $http_x_forwarded_proto;
                  '' $scheme;
              }

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              types_hash_max_size 2048;
              server_tokens off;

              keepalive_timeout 120s;
              keepalive_requests 100000;

              proxy_buffer_size 32k;
              proxy_buffers 8 64k;
              proxy_busy_buffers_size 128k;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
          MAIN

          cat <<'SITE_HEAD' | sudo tee /etc/nginx/sites-available/default > /dev/null
          upstream xray_backend {
              server unix:/dev/shm/xray.sock;
              keepalive 256;
              keepalive_timeout 120s;
              keepalive_requests 100000;
          }

          upstream ttyd_backend {
              server 127.0.0.1:7681;
              keepalive 64;
          }
          SITE_HEAD

          if [ "$ENABLE_DESKTOP" = "true" ]; then
            cat <<'KASM_UP' | sudo tee -a /etc/nginx/sites-available/default > /dev/null

          upstream kasm_backend {
              server 127.0.0.1:3000;
              keepalive 256;
          }
          KASM_UP
          fi

          cat <<'SITE_MID' | sudo tee -a /etc/nginx/sites-available/default > /dev/null

          server {
              listen 127.0.0.1:8000 default_server reuseport;
              server_name _;
              client_max_body_size 0;

              # === ۱. مسیر پروکسی VLESS XHTTP (SplitHTTP) — Prefix Match الزامی برای زیرمسیرهای packet-up ===
              location ^~ /prx-xhttp {
                  access_log off;
                  proxy_redirect off;
                  proxy_pass http://xray_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Connection "";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $forwarded_proto;

                  chunked_transfer_encoding on;
                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_cache off;
                  tcp_nodelay on;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
              }

              # === ۲. مسیر وب‌ترمینال لینوکس (ttyd) ===
              location = /terminal {
                  return 301 /terminal/;
              }

              location ^~ /terminal/ {
                  proxy_pass http://ttyd_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $forwarded_proto;

                  proxy_buffering off;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }
          SITE_MID

          if [ "$ENABLE_DESKTOP" = "true" ]; then
            cat <<'SITE_ROOT_DESKTOP' | sudo tee -a /etc/nginx/sites-available/default > /dev/null

              # === ۳. مسیر اصلی: ریموت دسکتاپ بروزر پرسرعت XFCE ===
              location / {
                  proxy_pass http://kasm_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $forwarded_proto;

                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }
          SITE_ROOT_DESKTOP
          else
            cat <<'SITE_ROOT_PROXY' | sudo tee -a /etc/nginx/sites-available/default > /dev/null

              # === ۳. مسیر اصلی در حالت پروکسی تنها (بدون خطای 502) ===
              location / {
                  access_log off;
                  default_type text/plain;
                  return 200 "OK\n";
              }
          SITE_ROOT_PROXY
          fi

          cat <<'SITE_TAIL' | sudo tee -a /etc/nginx/sites-available/default > /dev/null

              # === ۴. وضعیت سلامت سرور ===
              location = /health {
                  access_log off;
                  default_type application/json;
                  return 200 '{"status":"ok","transport":"xhttp","timestamp":"$time_iso8601"}';
              }
          }
          SITE_TAIL

          # اعمال اولویت بالای CPU و بازیابی خودکار برای سرویس Nginx
          sudo mkdir -p /etc/systemd/system/nginx.service.d
          cat <<'OVERRIDE' | sudo tee /etc/systemd/system/nginx.service.d/override.conf > /dev/null
          [Service]
          Nice=-10
          LimitNOFILE=131072
          Restart=always
          RestartSec=2
          OVERRIDE

          sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
          sudo systemctl daemon-reload
          sudo nginx -t
          sudo systemctl restart nginx
          curl -sf http://127.0.0.1:8000/health > /dev/null
          echo "✅ Nginx مالتی‌پلکسر (XHTTP + UDS Keepalive + اولویت CPU) اجرا شد."

      # === ۵. راه‌اندازی وب‌ترمینال و Cloudflare Tunnel (پروتکل خودکار QUIC/HTTP2) ===
      - name: 5. Launch Services & Cloudflare Tunnel (Auto QUIC/HTTP2 + High Priority)
        run: |
          # === ۱. کانفیگ اختصاصی tmux و سرویس systemd برای ttyd ===
          cat <<'TMUX' | sudo tee /home/prxcore/.tmux.conf > /dev/null
          set -g mouse on
          set -g history-limit 10000
          set -g default-terminal "screen-256color"
          TMUX
          sudo chown -R prxcore:prxcore /home/prxcore

          printf 'PRX_USER_PASS=%q\n' "$PRX_USER_PASS" | sudo tee /etc/ttyd.env > /dev/null
          sudo chown prxcore:prxcore /etc/ttyd.env
          sudo chmod 600 /etc/ttyd.env

          cat <<'TTYD_RUN' | sudo tee /usr/local/bin/start-ttyd.sh > /dev/null
          #!/bin/bash
          source /etc/ttyd.env
          export HOME=/home/prxcore
          export XDG_CONFIG_HOME=/home/prxcore/.config
          cd /home/prxcore || exit 1
          exec /usr/local/bin/ttyd \
            -i lo \
            -c "prxcore:$PRX_USER_PASS" \
            -W \
            -p 7681 \
            -b /terminal \
            -t fontSize=16 \
            -t 'theme={"background": "#0f172a"}' \
            -t enableWebgl=true \
            tmux -f /home/prxcore/.tmux.conf new-session -A -s prxcore_workspace
          TTYD_RUN
          sudo chmod +x /usr/local/bin/start-ttyd.sh

          cat <<'SERVICE' | sudo tee /etc/systemd/system/ttyd.service > /dev/null
          [Unit]
          Description=ttyd Web Terminal (prxcore)
          After=network.target

          [Service]
          Type=simple
          User=prxcore
          Group=prxcore
          WorkingDirectory=/home/prxcore
          Environment=HOME=/home/prxcore
          Environment=XDG_CONFIG_HOME=/home/prxcore/.config
          Environment=TERM=xterm-256color
          ExecStart=/usr/local/bin/start-ttyd.sh
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          SERVICE

          # === ۲. سرویس systemd امن برای Cloudflare Tunnel (حالت auto و حفظ --url برای توکن CLI) ===
          CLEAN_CF_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')
          printf 'TUNNEL_TOKEN=%s\n' "$CLEAN_CF_TOKEN" | sudo tee /etc/cloudflared.env > /dev/null
          sudo chmod 600 /etc/cloudflared.env

          cat <<'SERVICE' | sudo tee /etc/systemd/system/cloudflared.service > /dev/null
          [Unit]
          Description=Cloudflare Tunnel (Auto QUIC/HTTP2)
          After=network-online.target nginx.service
          Wants=network-online.target

          [Service]
          Type=simple
          Nice=-10
          EnvironmentFile=/etc/cloudflared.env
          ExecStart=/usr/local/bin/cloudflared tunnel --protocol auto --url http://127.0.0.1:8000 --no-autoupdate --edge-ip-version 4 --grace-period 30s --retries 15 run
          Restart=always
          RestartSec=2
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable --now ttyd
          sudo systemctl enable --now cloudflared

          # بررسی سلامت ttyd
          sleep 2
          if sudo systemctl is-active --quiet ttyd; then
            echo "✅ سرویس وب‌ترمینال (ttyd) با محیط ایزوله prxcore اجرا شد."
          else
            echo "❌ خطا در اجرای ttyd:"
            sudo journalctl -u ttyd --no-pager -n 20
            exit 1
          fi

          # انتظار هوشمند تا ثبت واقعی اتصال تانل در Edge کلودفلر (حداکثر ۴۰ ثانیه)
          echo "⏳ در حال بررسی اتصال تانل به سرورهای Edge کلودفلر..."
          CF_CONNECTED=0
          for i in {1..20}; do
            if sudo journalctl -u cloudflared --no-pager | grep -q "Registered tunnel connection"; then
              CF_CONNECTED=1
              break
            fi
            sleep 2
          done

          echo "📋 آخرین لاگ‌های cloudflared:"
          sudo journalctl -u cloudflared --no-pager -n 15

          if ! sudo systemctl is-active --quiet cloudflared || [ "$CF_CONNECTED" -ne 1 ]; then
            echo "❌ خطا در اتصال Cloudflare Tunnel!"
            exit 1
          fi

          CF_PROTO=$(sudo journalctl -u cloudflared --no-pager | grep "Registered tunnel connection" | tail -n 1 | grep -oE 'protocol=[a-z0-9]+' | cut -d= -f2 || echo "auto")
          echo "✅ Cloudflare Tunnel متصل شد (پروتکل فعال: $CF_PROTO)."

          # تست نهایی End-to-End از طریق دامنه عمومی کلودفلر
          echo "⏳ در حال تست مسیر عمومی https://$PRX_DOMAIN/health ..."
          EXT_OK=0
          for i in {1..10}; do
            EXT_CODE=$(curl -4 -s -o /dev/null -w '%{http_code}' --max-time 5 "https://$PRX_DOMAIN/health" 2>/dev/null || echo "000")
            if [ "$EXT_CODE" = "200" ]; then
              EXT_OK=1
              echo "✅ مسیر عمومی تانل و Nginx تأیید شد (HTTP 200 OK)."
              break
            fi
            sleep 2
          done
          if [ "$EXT_OK" -ne 1 ]; then
            echo "⚠️ هشدار: پاسخ تست عمومی HTTP $EXT_CODE بود."
          fi

      # === ۶. تولید لینک بهینه VLESS XHTTP و نگهداری هوشمند سرور ===
      - name: 6. Generate Connection Info & Keep Alive
        run: |
          # لینک VLESS XHTTP (SplitHTTP) با حالت packet-up (ضد QoS و کاملاً سازگار با Cloudflare CDN) و ALPN HTTP/2
          VLESS_LINK="vless://$PRX_UUID@$PRX_DOMAIN:443?encryption=none&security=tls&sni=$PRX_DOMAIN&fp=chrome&alpn=h2&type=xhttp&host=$PRX_DOMAIN&path=%2Fprx-xhttp&mode=packet-up#PRX-XHTTP"

          CF_PROTO=$(sudo journalctl -u cloudflared --no-pager | grep "Registered tunnel connection" | tail -n 1 | grep -oE 'protocol=[a-z0-9]+' | cut -d= -f2 || echo "auto")

          if [ "$ENABLE_DESKTOP" = "true" ]; then
            RUN_MINUTES=345
            MODE_LABEL="Full Desktop + Ultra XHTTP Proxy"
          else
            RUN_MINUTES=355
            MODE_LABEL="Proxy-Only Ultra Low-Latency XHTTP Mode"
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║   🎉 ULTRA LOW-LATENCY XHTTP PROXY & WORKSTATION ACTIVE! ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          printf "║  🧭 Active Mode:             %s\n" "$MODE_LABEL"
          printf "║  🌍 Runner Location:         %s\n" "${RUNNER_LOC:-Unknown}"
          printf "║  🌐 CF Tunnel Protocol:      %s\n" "$CF_PROTO"
          if [ "$ENABLE_DESKTOP" = "true" ]; then
            printf "║  🚀 Remote Desktop / Chrome: https://%s\n" "$PRX_DOMAIN"
          fi
          printf "║  💻 Web Terminal:            https://%s/terminal/\n" "$PRX_DOMAIN"
          echo "║  🔐 Login Username:          prxcore                     ║"
          echo "║  🔐 Password:                [Defined in PRX_USER_PASS]  ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  ⚡ XHTTP (SplitHTTP) Optimizations Active:              ║"
          echo "║    ✅ Transport: XHTTP (mode=packet-up, alpn=h2)         ║"
          echo "║    ✅ Unix Domain Socket (/dev/shm/xray.sock + Keepalive)║"
          echo "║    ✅ CF Tunnel Auto Protocol (QUIC First, No HoL Block) ║"
          echo "║    ✅ Xray Buffer 512KB + AsIs Routing + QUIC Blocked    ║"
          echo "║    ✅ CPU Priority (Nice=-10) for Xray, Nginx & CF       ║"
          echo "║    ✅ BBR + Low-Jitter DNS + 16MB QUIC Buffers           ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🚀 VLESS XHTTP Link (Set Clean IP in v2rayN):           ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "$VLESS_LINK"
          echo ""
          echo "⏱️ سرور تا $RUN_MINUTES دقیقه فعال می‌ماند..."
          echo "=================================================="

          # شکار سیگنال Cancel گیت‌هاب برای خروج فوری
          SLEEP_PID=""
          trap 'echo "⚠️ سیگنال توقف دریافت شد! خروج فوری..."; [ -n "$SLEEP_PID" ] && kill "$SLEEP_PID" 2>/dev/null || true; exit 0' SIGINT SIGTERM

          for i in $(seq 1 "$RUN_MINUTES"); do
            sleep 60 &
            SLEEP_PID=$!
            wait "$SLEEP_PID"
            if [ $((i % 10)) -eq 0 ]; then
              CF_UP=$(pgrep -c -x "cloudflared" 2>/dev/null || true)
              XRAY_UP=$(pgrep -c -x "xray" 2>/dev/null || true)
              NGINX_UP=$(pgrep -c -x "nginx" 2>/dev/null || true)
              TTYD_UP=$(pgrep -c -x "ttyd" 2>/dev/null || true)
              if [ "$ENABLE_DESKTOP" = "true" ]; then
                KASM_UP=$(sudo docker inspect -f '{{.State.Running}}' kasm-chrome 2>/dev/null || echo "false")
              else
                KASM_UP="OFF"
              fi
              echo "[$i/$RUN_MINUTES] 📊 Status: CF=${CF_UP:-0} ($CF_PROTO) | Xray=${XRAY_UP:-0} | Nginx=${NGINX_UP:-0} | ttyd=${TTYD_UP:-0} | Kasm=$KASM_UP"
            else
              echo "[$i/$RUN_MINUTES] 🟢 Running XHTTP on $PRX_DOMAIN ($CF_PROTO)"
            fi
          done
          echo "⏰ زمان کاری به پایان رسید."

      # === ۷. بستن ایمن کروم و توقف کانتینر برای ذخیره کوکی‌ها (فقط در حالت دسکتاپ) ===
      - name: 7. Gracefully Stop Browser & Clean Sockets
        if: always() && inputs.enable_desktop && steps.setup_desktop.outcome == 'success'
        run: |
          echo "⏹️ ارسال سیگنال خروج امن به Google Chrome..."
          sudo docker exec kasm-chrome pkill -TERM -f "/opt/google/chrome/chrome" 2>/dev/null || true
          for i in {1..10}; do
            if ! sudo docker exec kasm-chrome pgrep -f "/opt/google/chrome/chrome" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          echo "⏹️ متوقف کردن ایمن کانتینر برای ثبت نهایی کوکی‌ها..."
          sudo docker stop kasm-chrome -t 15 2>/dev/null || true

          # حذف فایل‌های موقت، قفل‌ها، سوکت‌ها و کش‌های حجیم کروم
          sudo rm -rf \
            /home/runner/kasm_data/.cache \
            /home/runner/kasm_data/Singleton* \
            /home/runner/kasm_data/.config/google-chrome/Singleton* \
            /home/runner/kasm_data/.config/google-chrome/*/Cache \
            /home/runner/kasm_data/.config/google-chrome/*/Cache_Data \
            /home/runner/kasm_data/.config/google-chrome/*/Code\ Cache \
            /home/runner/kasm_data/.config/google-chrome/*/GPUCache \
            /home/runner/kasm_data/.config/google-chrome/*/Service\ Worker/CacheStorage \
            /home/runner/kasm_data/.config/google-chrome/ShaderCache \
            /home/runner/kasm_data/.config/google-chrome/GrShaderCache \
            /home/runner/kasm_data/.config/google-chrome/OptGuideOnDeviceModel \
            /home/runner/kasm_data/.X11-unix \
            /home/runner/kasm_data/tmp 2>/dev/null || true

          sudo chown -R runner:docker /home/runner/kasm_data
          sudo chmod -R u+rwX /home/runner/kasm_data
          echo "✅ داده‌های پروفایل با موفقیت پاکسازی و آماده ذخیره‌سازی شدند."

      # === ۸. ذخیره‌سازی آرشیو سشن‌ها و کوکی‌ها در گیت‌هاب (فقط در حالت دسکتاپ) ===
      - name: 8. Save Persistent Browser Profile & Cookies
        if: always() && inputs.enable_desktop && steps.setup_desktop.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/kasm_data
          key: kasm-profile-${{ github.run_id }}
