name: prxcore Beast Workstation & Ultra Low-Latency Remote Browser (Webtop XFCE + Xray)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      TERM: xterm-256color
      CF_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
      PRX_DOMAIN: ${{ secrets.PRX_DOMAIN }}
      PRX_UUID: ${{ secrets.PRX_UUID }}
      PRX_USER_PASS: ${{ secrets.PRX_USER_PASS }}

    steps:
      # === ۰. بازیابی سشن‌ها، کوکی‌ها و افزونه‌های ذخیره‌شده از اجراهای قبلی ===
      - name: 0. Restore Persistent Browser Profile & Cookies
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/kasm_data
          key: kasm-profile-${{ github.run_id }}
          restore-keys: |
            kasm-profile-

      - name: 1. Validate Secrets & Deep Kernel Network Tuning (BBR + MSS Clamping + Low-Latency TCP)
        run: |
          # --- اعتبارسنجی سکرت‌ها ---
          if [ -z "$CF_TOKEN" ] || [ -z "$PRX_DOMAIN" ] || [ -z "$PRX_UUID" ] || [ -z "$PRX_USER_PASS" ]; then
            echo "❌ خطا: لطفاً مطمئن شوید تمام سکرت‌ها (CF_TUNNEL_TOKEN, PRX_DOMAIN, PRX_UUID, PRX_USER_PASS) در تنظیمات گیت‌هاب تعریف شده‌اند."
            exit 1
          fi
          echo "✅ تمام سکرت‌ها تأیید شدند."

          # --- تثبیت فوری DNS سیستم برای جلوگیری از قطع شدن رزولوشن دامنه پس از غیرفعال‌سازی IPv6 ---
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\nnameserver 9.9.9.9\noptions timeout:2 attempts:3 rotate\n" | sudo tee /etc/resolv.conf > /dev/null

          # --- فعال‌سازی ماژول BBR در هسته لینوکس ---
          sudo modprobe tcp_bbr 2>/dev/null || true
          echo "tcp_bbr" | sudo tee -a /etc/modules-load.d/bbr.conf > /dev/null

          # --- بهینه‌سازی کرنل برای کاهش لیتنسی و پایداری استریم روی شبکه گیت‌هاب ---
          sudo tee /etc/sysctl.d/99-prxcore-optimize.conf > /dev/null <<'SYSCTL'
          # === BBR Congestion Control ===
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr

          # === غیرفعال‌سازی TCP Fast Open برای جلوگیری از دراپ پکت‌های TLS در NAT آژور/گیت‌هاب ===
          net.ipv4.tcp_fastopen = 0

          # === حذف وقفه Slow Start پس از بی‌کاری سوکت ===
          net.ipv4.tcp_slow_start_after_idle = 0

          # === کاهش فوق‌العاده Bufferbloat و لیتنسی ریموت دسکتاپ ===
          net.ipv4.tcp_notsent_lowat = 16384

          # === بافرهای بهینه شبکه برای نرخ فریم ۶۰fps و پایداری استریم ===
          net.core.rmem_default = 2097152
          net.core.rmem_max = 67108864
          net.core.wmem_default = 2097152
          net.core.wmem_max = 67108864
          net.ipv4.tcp_rmem = 4096 2097152 67108864
          net.ipv4.tcp_wmem = 4096 2097152 67108864
          net.core.somaxconn = 65535
          net.core.netdev_max_backlog = 250000
          net.core.optmem_max = 65536

          # === تنظیمات Window Scaling و ریکاوری بلادرنگ پکت‌ها ===
          net.ipv4.tcp_window_scaling = 1
          net.ipv4.tcp_adv_win_scale = 1
          net.ipv4.tcp_sack = 1
          net.ipv4.tcp_dsack = 1
          net.ipv4.tcp_timestamps = 1
          net.ipv4.tcp_no_metrics_save = 1
          net.ipv4.tcp_frto = 2
          net.ipv4.tcp_fin_timeout = 15
          net.ipv4.tcp_tw_reuse = 1
          net.ipv4.tcp_max_tw_buckets = 2000000

          # === Keepalive بهینه (تست سلامت سریع کانکشن در زمان تفکر طولانی هوش مصنوعی) ===
          net.ipv4.tcp_keepalive_time = 20
          net.ipv4.tcp_keepalive_intvl = 5
          net.ipv4.tcp_keepalive_probes = 9

          # === امنیت و فعال‌سازی MTU Probing برای جلوگیری از قفل شدن استریم‌های حجیم Gemini ===
          net.ipv4.tcp_syncookies = 1
          net.ipv4.tcp_max_syn_backlog = 65535
          net.ipv4.tcp_mtu_probing = 1
          net.ipv4.ip_local_port_range = 1024 65535
          net.ipv4.tcp_ecn = 0

          # === ARP و غیرفعال‌سازی IPv6 برای مسیردهی مستقیم ===
          net.ipv4.neigh.default.gc_thresh1 = 1024
          net.ipv4.neigh.default.gc_thresh2 = 4096
          net.ipv4.neigh.default.gc_thresh3 = 8192
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
          SYSCTL

          sudo sysctl --system > /dev/null 2>&1

          # --- تنظیم خودکار سایز پکت‌ها (TCP MSS Clamping) با استثنا کردن اینترفیس داخلی lo ---
          sudo iptables -t mangle -A POSTROUTING ! -o lo -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
          sudo iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
          sudo iptables -t mangle -A OUTPUT ! -o lo -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true

          echo "✅ تنظیمات کرنل، DNS پایدار، BBR، MTU Probing و TCP MSS Clamping اعمال شدند."

      - name: 2. Setup Secure User, Dependencies & Deploy Extreme Webtop XFCE Desktop
        id: setup_desktop
        run: |
          id -u prxcore &>/dev/null || sudo useradd -m -s /bin/bash prxcore
          echo "prxcore:$PRX_USER_PASS" | sudo chpasswd
          sudo usermod -aG sudo prxcore
          echo "prxcore ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/prxcore > /dev/null
          sudo chmod 440 /etc/sudoers.d/prxcore
          sudo mkdir -p /home/prxcore/.config/tmux
          sudo chown -R prxcore:prxcore /home/prxcore

          # --- حذف میرور ناپایدار آژور (azure.archive.ubuntu.com) و جایگزینی با مخازن اصلی اوبونتو ---
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo tee /etc/apt/apt-mirrors.txt > /dev/null <<'MIRRORS'
          http://archive.ubuntu.com/ubuntu/
          http://us.archive.ubuntu.com/ubuntu/
          http://mirrors.edge.kernel.org/ubuntu/
          MIRRORS
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo sed -i 's|https://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true

          # --- نصب پکیج‌ها با اجبار به IPv4 و تلاش مجدد خودکار در صورت نوسان شبکه ---
          sudo apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout="15" update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y \
            htop tmux curl wget unzip nginx qrencode jq -qq

          # نصب fastfetch (از مخزن یا نسخه رسمی گیت‌هاب در صورت نبودن در ریپوی اوبونتو)
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y fastfetch -qq 2>/dev/null; then
            curl -fsSL --retry 3 https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb -o /tmp/fastfetch.deb 2>/dev/null && \
              sudo dpkg -i /tmp/fastfetch.deb >/dev/null 2>&1 || true
            rm -f /tmp/fastfetch.deb
          fi

          # دانلود پایدار ttyd و cloudflared با قابلیت Retry و اعتبارسنجی
          sudo curl -fsSL --retry 5 --retry-delay 2 https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd

          sudo curl -fsSL --retry 5 --retry-delay 2 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared

          # آماده‌سازی دایرکتوری پایدار پروفایل و پوشه‌های کانفیگ XFCE
          mkdir -p /home/runner/kasm_data/.config/autostart
          mkdir -p /home/runner/kasm_data/Desktop

          # حذف فایل‌های قفل موقت پیشین
          sudo rm -f /home/runner/kasm_data/Singleton* \
                      /home/runner/kasm_data/.config/google-chrome/Singleton* 2>/dev/null || true

          # تنظیم سوییچ دائمی کیبورد فارسی و انگلیسی با Alt+Shift در استارتاپ میزکار
          cat <<'DESKTOP' > /home/runner/kasm_data/.config/autostart/keyboard.desktop
          [Desktop Entry]
          Type=Application
          Exec=setxkbmap -layout "us,ir" -option "grp:alt_shift_toggle"
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=Persian Keyboard Layout
          DESKTOP

          # شورت‌کات اجرای مرورگر کروم روی دسکتاپ (همراه با --disable-quic جهت رفع مشکل سینک Gemini)
          cat <<'DESKTOP' > /home/runner/kasm_data/Desktop/google-chrome.desktop
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Google Chrome
          Comment=Access the Internet
          Exec=/usr/bin/google-chrome-stable --no-sandbox --disable-dev-shm-usage --password-store=basic --disable-quic --num-raster-threads=4 --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader %U
          Icon=google-chrome
          Path=/config
          Terminal=false
          StartupNotify=true
          DESKTOP
          chmod +x /home/runner/kasm_data/Desktop/google-chrome.desktop

          # اجرای خودکار مرورگر کروم هنگام بالا آمدن دسکتاپ با غیرفعال‌سازی QUIC و تنظیمات رندرینگ
          cat <<'DESKTOP' > /home/runner/kasm_data/.config/autostart/chrome.desktop
          [Desktop Entry]
          Type=Application
          Exec=/usr/bin/google-chrome-stable --no-sandbox --disable-dev-shm-usage --password-store=basic --disable-quic --num-raster-threads=4 --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=Google Chrome Autostart
          DESKTOP

          sudo chown -R 1000:1000 /home/runner/kasm_data

          # اجرای کانتینر میزکار کامل لینوکس (Webtop XFCE) با shm-size ایمن (4g) برای جلوگیری از OOM
          sudo docker run -d \
            --name=kasm-chrome \
            -p 127.0.0.1:3000:3000 \
            --shm-size=4g \
            --ipc=host \
            --dns=1.1.1.1 \
            --dns=8.8.8.8 \
            -v /home/runner/kasm_data:/config \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e LC_ALL=en_US.UTF-8 \
            -e CUSTOM_USER=prxcore \
            -e PASSWORD="$PRX_USER_PASS" \
            -e KEYBOARD="us,ir" \
            --restart unless-stopped \
            lscr.io/linuxserver/webtop:ubuntu-xfce

          # انتظار هوشمند تا بالا آمدن کامل سرور گرافیکی Xorg/Selkies در کانتینر
          echo "⏳ انتظار برای بالا آمدن کامل X Server در کانتینر..."
          for i in {1..30}; do
            if sudo docker exec kasm-chrome pgrep -f "Xorg|Xvfb|selkies" >/dev/null 2>&1; then
              echo "✅ سرور گرافیکی آماده است."
              break
            fi
            sleep 1
          done

          # نصب مستقل فونت‌های فارسی، ابزار کیبورد و مرورگر Google Chrome بدون شکست خاموش
          echo "⏳ در حال نصب فونت‌های فارسی و Google Chrome روی میزکار..."
          sudo docker exec -u 0 kasm-chrome bash -c '
            set -e
            apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true update -qq
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y -qq x11-xkb-utils wget ca-certificates
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y -qq fonts-vazirmatn 2>/dev/null || true
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y -qq fonts-farsiweb 2>/dev/null || true
            wget -q --tries=5 https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
            DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 -o Acquire::ForceIPv4=true install -y -qq /tmp/chrome.deb || \
              DEBIAN_FRONTEND=noninteractive apt-get -f install -y -qq
            rm -f /tmp/chrome.deb
          '

          # اعمال نقشه کیبورد و اجرای خودکار کروم (با QUIC غیرفعال) با HOME صحیح در کانتینر
          sudo docker exec -u 1000 -e DISPLAY=:1 -e HOME=/config kasm-chrome bash -c "
            setxkbmap -layout 'us,ir' -option 'grp:alt_shift_toggle' 2>/dev/null || true
            pgrep -f google-chrome >/dev/null || nohup /usr/bin/google-chrome-stable --no-sandbox --disable-dev-shm-usage --password-store=basic --disable-quic --num-raster-threads=4 --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader >/dev/null 2>&1 &
          " 2>/dev/null || true

          echo "✅ میزکار XFCE همراه با Google Chrome (بدون تداخل QUIC) و کیبورد فارسی مستقر شدند."

      - name: 3. Install & Configure Xray-Core (Fully Optimized VLESS WS with Heartbeat & EarlyData)
        run: |
          export TERM=xterm-256color
          curl -fsSL --retry 5 https://github.com/XTLS/Xray-install/raw/main/install-release.sh -o /tmp/install-xray.sh
          sed -i 's/tput setaf [0-9]/true/g; s/tput sgr0/true/g' /tmp/install-xray.sh

          if ! sudo env TERM=xterm-256color bash /tmp/install-xray.sh install; then
            echo "⚠️ اسکریپت نصب با محدودیت مواجه شد؛ در حال نصب مستقیم هسته Xray..."
            sudo mkdir -p /usr/local/bin /usr/local/share/xray /usr/local/etc/xray
            curl -fsSL --retry 5 https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
            sudo unzip -qo /tmp/xray.zip -d /usr/local/bin/
            sudo chmod +x /usr/local/bin/xray
            sudo mv -f /usr/local/bin/*.dat /usr/local/share/xray/ 2>/dev/null || true
            rm -f /tmp/xray.zip

            cat <<'SERVICE' | sudo tee /etc/systemd/system/xray.service > /dev/null
          [Unit]
          Description=Xray Service
          Documentation=https://github.com/xtls
          After=network.target nss-lookup.target

          [Service]
          User=nobody
          CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          ExecStart=/usr/local/bin/xray run -config /usr/local/etc/xray/config.json
          Restart=on-failure
          RestartPreventExitStatus=23
          LimitNPROC=10000
          LimitNOFILE=1000000

          [Install]
          WantedBy=multi-user.target
          SERVICE
            sudo systemctl daemon-reload
          fi

          sudo mkdir -p /usr/local/etc/xray
          cat <<EOF | sudo tee /usr/local/etc/xray/config.json > /dev/null
          {
            "log": {
              "loglevel": "warning",
              "access": "none"
            },
            "dns": {
              "servers": [
                {
                  "address": "1.1.1.1",
                  "skipFallback": true
                },
                "8.8.8.8"
              ],
              "queryStrategy": "UseIPv4",
              "disableCache": false
            },
            "inbounds": [
              {
                "port": 8080,
                "listen": "127.0.0.1",
                "protocol": "vless",
                "settings": {
                  "clients": [
                    {
                      "id": "$PRX_UUID",
                      "level": 0
                    }
                  ],
                  "decryption": "none"
                },
                "streamSettings": {
                  "network": "ws",
                  "wsSettings": {
                    "path": "/prx-stream",
                    "heartbeatPeriod": 20
                  },
                  "sockopt": {
                    "tcpNoDelay": true,
                    "tcpKeepAliveInterval": 15,
                    "tcpKeepAliveIdle": 30
                  }
                },
                "sniffing": {
                  "enabled": true,
                  "destOverride": ["http", "tls", "quic"],
                  "routeOnly": false
                }
              }
            ],
            "outbounds": [
              {
                "tag": "direct",
                "protocol": "freedom",
                "settings": {
                  "domainStrategy": "UseIPv4"
                },
                "streamSettings": {
                  "sockopt": {
                    "tcpNoDelay": true,
                    "tcpCongestion": "bbr",
                    "tcpKeepAliveInterval": 15,
                    "tcpKeepAliveIdle": 30
                  }
                }
              },
              {
                "tag": "block",
                "protocol": "blackhole",
                "settings": {
                  "response": {
                    "type": "none"
                  }
                }
              }
            ],
            "routing": {
              "domainStrategy": "IPIfNonMatch",
              "rules": [
                {
                  "type": "field",
                  "outboundTag": "block",
                  "protocol": ["bittorrent", "quic"]
                },
                {
                  "type": "field",
                  "outboundTag": "block",
                  "network": "udp",
                  "port": "443"
                },
                {
                  "type": "field",
                  "outboundTag": "direct",
                  "network": "tcp,udp"
                }
              ]
            },
            "policy": {
              "levels": {
                "0": {
                  "handshake": 10,
                  "connIdle": 3600,
                  "uplinkOnly": 5,
                  "downlinkOnly": 10,
                  "bufferSize": 64
                }
              },
              "system": {
                "statsOutboundUplink": false,
                "statsOutboundDownlink": false
              }
            }
          }
          EOF

          # تست اعتبارسنجی کانفیگ Xray پیش از اجرا
          sudo /usr/local/bin/xray run -test -config /usr/local/etc/xray/config.json

          sudo systemctl daemon-reload
          sudo systemctl enable xray
          sudo systemctl restart xray
          sleep 2

          if sudo systemctl is-active --quiet xray; then
            echo "✅ Xray با پینگ خودکار (Heartbeat)، پشتیبانی 0-RTT و بافر ضد Bufferbloat اجرا شد."
          else
            echo "❌ خطا در اجرای Xray:"
            sudo journalctl -u xray --no-pager -n 25
            exit 1
          fi

      - name: 4. Configure Nginx Ultra Multiplexer (No-Lag WebSocket & True Upstream Keepalive)
        run: |
          cat <<'MAIN' | sudo tee /etc/nginx/nginx.conf > /dev/null
          user www-data;
          worker_processes auto;
          worker_rlimit_nofile 131072;
          pid /run/nginx.pid;

          events {
              worker_connections 16384;
              multi_accept on;
              use epoll;
          }

          http {
              map $http_upgrade $connection_upgrade {
                  default upgrade;
                  '' "";
              }

              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              types_hash_max_size 2048;
              server_tokens off;

              keepalive_timeout 3600;
              keepalive_requests 100000;

              proxy_buffer_size 32k;
              proxy_buffers 8 64k;
              proxy_busy_buffers_size 128k;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
              include /etc/nginx/sites-enabled/*;
          }
          MAIN

          cat <<'SITE' | sudo tee /etc/nginx/sites-available/default > /dev/null
          upstream xray_backend {
              server 127.0.0.1:8080;
              keepalive 512;
          }

          upstream ttyd_backend {
              server 127.0.0.1:7681;
              keepalive 64;
          }

          upstream kasm_backend {
              server 127.0.0.1:3000;
              keepalive 256;
          }

          server {
              listen 8000 default_server reuseport;
              server_name _;
              client_max_body_size 0;

              # === ۱. مسیر پروکسی فیلترشکن VLESS WS ===
              location /prx-stream {
                  if ($http_upgrade !~* "websocket") {
                      return 404;
                  }
                  access_log off;
                  proxy_redirect off;
                  proxy_pass http://xray_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_cache off;
                  tcp_nodelay on;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === ۲. مسیر وب‌ترمینال لینوکس (ttyd) ===
              location = /terminal {
                  return 301 /terminal/;
              }

              location ^~ /terminal/ {
                  proxy_pass http://ttyd_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                  proxy_buffering off;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === ۳. مسیر اصلی: ریموت دسکتاپ بروزر پرسرعت XFCE ===
              location / {
                  proxy_pass http://kasm_backend;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_buffering off;
                  proxy_request_buffering off;
                  proxy_connect_timeout 2s;
                  proxy_read_timeout 86400s;
                  proxy_send_timeout 86400s;
                  proxy_socket_keepalive on;
              }

              # === ۴. وضعیت سلامت سرور ===
              location /health {
                  access_log off;
                  default_type application/json;
                  return 200 '{"status":"ok","timestamp":"$time_iso8601"}';
              }
          }
          SITE

          sudo ln -sf /etc/nginx/sites-available/default /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl restart nginx
          echo "✅ Nginx مالتی‌پلکسر با Keepalive واقعی و WebSocket بهینه اجرا شد."

      - name: 5. Launch Services & Cloudflare Tunnel (Systemd Managed & Verified)
        run: |
          # === ۱. کانفیگ اختصاصی tmux و سرویس systemd برای ttyd ===
          cat <<'TMUX' | sudo tee /home/prxcore/.tmux.conf > /dev/null
          set -g mouse on
          set -g history-limit 10000
          set -g default-terminal "screen-256color"
          TMUX
          sudo chown -R prxcore:prxcore /home/prxcore

          printf 'PRX_USER_PASS=%q\n' "$PRX_USER_PASS" | sudo tee /etc/ttyd.env > /dev/null
          sudo chown prxcore:prxcore /etc/ttyd.env
          sudo chmod 600 /etc/ttyd.env

          cat <<'TTYD_RUN' | sudo tee /usr/local/bin/start-ttyd.sh > /dev/null
          #!/bin/bash
          source /etc/ttyd.env
          export HOME=/home/prxcore
          export XDG_CONFIG_HOME=/home/prxcore/.config
          cd /home/prxcore || exit 1
          exec /usr/local/bin/ttyd \
            -c "prxcore:$PRX_USER_PASS" \
            -W \
            -p 7681 \
            -b /terminal \
            -t fontSize=16 \
            -t 'theme={"background": "#0f172a"}' \
            -t rendererType=webgl \
            tmux -f /home/prxcore/.tmux.conf new-session -A -s prxcore_workspace
          TTYD_RUN
          sudo chmod +x /usr/local/bin/start-ttyd.sh

          cat <<'SERVICE' | sudo tee /etc/systemd/system/ttyd.service > /dev/null
          [Unit]
          Description=ttyd Web Terminal (prxcore)
          After=network.target

          [Service]
          Type=simple
          User=prxcore
          Group=prxcore
          WorkingDirectory=/home/prxcore
          Environment=HOME=/home/prxcore
          Environment=XDG_CONFIG_HOME=/home/prxcore/.config
          Environment=TERM=xterm-256color
          ExecStart=/usr/local/bin/start-ttyd.sh
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          SERVICE

          # === ۲. سرویس systemd امن برای Cloudflare Tunnel (بدون نمایش توکن در ps) ===
          CLEAN_CF_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '\r\n ')
          printf 'TUNNEL_TOKEN=%s\n' "$CLEAN_CF_TOKEN" | sudo tee /etc/cloudflared.env > /dev/null
          sudo chmod 600 /etc/cloudflared.env

          cat <<'SERVICE' | sudo tee /etc/systemd/system/cloudflared.service > /dev/null
          [Unit]
          Description=Cloudflare Tunnel (HTTP/2 Stable)
          After=network-online.target nginx.service
          Wants=network-online.target

          [Service]
          Type=simple
          EnvironmentFile=/etc/cloudflared.env
          ExecStart=/usr/local/bin/cloudflared tunnel --protocol http2 --url http://127.0.0.1:8000 --no-autoupdate --edge-ip-version 4 --grace-period 30s --retries 15 run
          Restart=always
          RestartSec=2
          LimitNOFILE=1048576

          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable --now ttyd
          sudo systemctl enable --now cloudflared

          # بررسی سلامت ttyd
          sleep 2
          if sudo systemctl is-active --quiet ttyd; then
            echo "✅ سرویس وب‌ترمینال (ttyd) با محیط ایزوله prxcore اجرا شد."
          else
            echo "❌ خطا در اجرای ttyd:"
            sudo journalctl -u ttyd --no-pager -n 20
            exit 1
          fi

          # انتظار هوشمند تا ثبت واقعی اتصال تانل در Edge کلودفلر (حداکثر ۲۰ ثانیه)
          echo "⏳ در حال بررسی اتصال تانل به سرورهای Edge کلودفلر..."
          CF_CONNECTED=0
          for i in {1..10}; do
            if sudo journalctl -u cloudflared --no-pager | grep -q "Registered tunnel connection"; then
              CF_CONNECTED=1
              break
            fi
            sleep 2
          done

          echo "📋 آخرین لاگ‌های cloudflared:"
          sudo journalctl -u cloudflared --no-pager -n 15

          if sudo systemctl is-active --quiet cloudflared && [ "$CF_CONNECTED" -eq 1 ]; then
            echo "✅ Cloudflare Tunnel با موفقیت به Edge کلودفلر متصل شد."
          else
            echo "❌ خطا در اتصال Cloudflare Tunnel!"
            exit 1
          fi

      - name: 6. Generate Connection Info & Keep Alive (Safe Margin Before Timeout)
        run: |
          # لینک VLESS مجهز به Early Data (ed=2048) و بدون قفل محدودکننده ALPN
          VLESS_LINK="vless://$PRX_UUID@$PRX_DOMAIN:443?path=%2Fprx-stream%3Fed%3D2048&security=tls&encryption=none&type=ws&sni=$PRX_DOMAIN&host=$PRX_DOMAIN&fp=chrome#PRX-Ultra"

          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║   🎉 ULTRA LOW-LATENCY WORKSTATION & BROWSER ACTIVE!     ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║                                                          ║"
          printf "║  🚀 Remote Desktop / Chrome: https://%s\n" "$PRX_DOMAIN"
          printf "║  💻 Web Terminal:            https://%s/terminal/\n" "$PRX_DOMAIN"
          echo "║  🔐 Login Username:          prxcore                     ║"
          echo "║  🔐 Password:                [Defined in PRX_USER_PASS]  ║"
          echo "║                                                          ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  ⚡ Ultra Optimizations Applied:                        ║"
          echo "║    ✅ Full XFCE Desktop + Native X11 Key Mapping        ║"
          echo "║    ✅ Dual Language Keyboard (English + Persian)         ║"
          echo "║    ✅ Toggle Shortcut: Alt + Shift                       ║"
          echo "║    ✅ Google Chrome Official (QUIC Disabled for Gemini)  ║"
          echo "║    ✅ Systemd Managed Services (Xray + ttyd + CF Tunnel) ║"
          echo "║    ✅ WS Heartbeat (20s) + 0-RTT EarlyData (ed=2048)     ║"
          echo "║    ✅ 4GB Safe Shared RAM (shm) + Host IPC Mode          ║"
          echo "║    ✅ BBR + MTU Probing + QUIC Blocked in Xray          ║"
          echo "║    ✅ Safe Conditional Cache Save on Manual Cancel       ║"
          echo "╠══════════════════════════════════════════════════════════╣"
          echo "║  🚀 VLESS Connection Link:                              ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "$VLESS_LINK"
          echo ""
          echo "⏱️ سرور تا ۵ ساعت و ۴۵ دقیقه فعال می‌ماند و سپس ۱۵ دقیقه صرف ذخیره امن کوکی‌ها می‌شود..."
          echo "=================================================="

          # شکار سیگنال Cancel گیت‌هاب برای خروج فوری و اجرای مرحله ذخیره کش کوکی‌ها
          SLEEP_PID=""
          trap 'echo "⚠️ سیگنال توقف دریافت شد! خروج فوری برای ذخیره امن کوکی‌ها..."; [ -n "$SLEEP_PID" ] && kill "$SLEEP_PID" 2>/dev/null || true; exit 0' SIGINT SIGTERM

          # ۳۴۵ دقیقه (۵ ساعت و ۴۵ دقیقه) جهت تضمین اجرای کامل مراحل ۷ و ۸ قبل از سقف ۳۶۰ دقیقه‌ای گیت‌هاب
          for i in $(seq 1 345); do
            sleep 60 &
            SLEEP_PID=$!
            wait "$SLEEP_PID"
            if [ $((i % 10)) -eq 0 ]; then
              CF_UP=$(pgrep -c -x "cloudflared" 2>/dev/null || echo "0")
              XRAY_UP=$(pgrep -c -x "xray" 2>/dev/null || echo "0")
              NGINX_UP=$(pgrep -c -x "nginx" 2>/dev/null || echo "0")
              TTYD_UP=$(pgrep -c -x "ttyd" 2>/dev/null || echo "0")
              KASM_UP=$(sudo docker inspect -f '{{.State.Running}}' kasm-chrome 2>/dev/null || echo "false")
              echo "[$i/345] 📊 Status: CF=$CF_UP | Xray=$XRAY_UP | Nginx=$NGINX_UP | ttyd=$TTYD_UP | Kasm=$KASM_UP"
            else
              echo "[$i/345] 🟢 Running on $PRX_DOMAIN (HTTP/2 Stable)"
            fi
          done
          echo "⏰ زمان کاری به پایان رسید. در حال ذخیره ایمن کوکی‌ها و پروفایل..."

      # === ۷. متوقف کردن ایمن کانتینر برای ذخیره نهایی کوکی‌ها و پاکسازی کش‌های حجیم و موقت ===
      - name: 7. Gracefully Stop Browser & Clean Sockets
        if: always() && steps.setup_desktop.outcome == 'success'
        run: |
          echo "⏹️ متوقف کردن ایمن کانتینر برای ثبت نهایی کوکی‌ها..."
          sudo docker stop kasm-chrome -t 10 2>/dev/null || true

          # حذف فایل‌های موقت، قفل‌ها، سوکت‌ها و کش‌های حجیم کروم (با حفظ کامل کوکی‌ها، پسوردها و افزونه‌ها)
          sudo rm -rf /home/runner/kasm_data/.cache \
                      /home/runner/kasm_data/Singleton* \
                      /home/runner/kasm_data/.config/google-chrome/Singleton* \
                      /home/runner/kasm_data/.config/google-chrome/Default/Cache \
                      /home/runner/kasm_data/.config/google-chrome/Default/Code\ Cache \
                      /home/runner/kasm_data/.config/google-chrome/Default/GPUCache \
                      /home/runner/kasm_data/.config/google-chrome/Default/Service\ Worker/CacheStorage \
                      /home/runner/kasm_data/.config/google-chrome/ShaderCache \
                      /home/runner/kasm_data/.X11-unix \
                      /home/runner/kasm_data/tmp 2>/dev/null || true

          # آزادسازی دسترسی ایمن برای کاربر runner جهت ساخت آرشیو کش بدون خراب کردن پرمیشن‌ها
          sudo chown -R runner:docker /home/runner/kasm_data
          sudo chmod -R u+rwX /home/runner/kasm_data
          echo "✅ داده‌های پروفایل با موفقیت پاکسازی و آماده ذخیره‌سازی شدند."

      # === ۸. ذخیره‌سازی آرشیو سشن‌ها و کوکی‌ها در گیت‌هاب ===
      - name: 8. Save Persistent Browser Profile & Cookies
        if: always() && steps.setup_desktop.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/kasm_data
          key: kasm-profile-${{ github.run_id }}
